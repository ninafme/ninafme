
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- Filtros de Brilho Neon Aprimorados -->
    <filter id="glow-purple" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <filter id="glow-pink" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Gradientes para Volume e Profundidade -->
    <linearGradient id="grad-brain-depth" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a0b2e" />
      <stop offset="50%" stop-color="#0d0714" />
      <stop offset="100%" stop-color="#1a0b2e" />
    </linearGradient>

    <radialGradient id="grad-node-core" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="grad-purple-pink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <style>
      /* Animações CSS Avançadas */
      @keyframes pulse {
        0%, 100% { opacity: 0.3; transform: scale(0.95); }
        50% { opacity: 1; transform: scale(1.3); }
      }

      @keyframes syn-flow {
        0% { stroke-dashoffset: 60; }
        100% { stroke-dashoffset: 0; }
      }

      @keyframes glow-pulse {
        0%, 100% { filter: drop-shadow(0 0 10px #f472b6); }
        50% { filter: drop-shadow(0 0 25px #f472b6); }
      }

      /* Estilização Geral */
      text { font-family: 'Segoe UI', system-ui, sans-serif; user-select: none; }
      
      .synapse-line {
        stroke: url(#grad-purple-pink);
        stroke-width: 1.8;
        stroke-dasharray: 6 6;
        animation: syn-flow 4s linear infinite;
        opacity: 0.7;
      }

      .node {
        transform-box: fill-box;
        transform-origin: center;
        animation: pulse 3s infinite ease-in-out, glow-pulse 3s infinite ease-in-out;
      }

      .n1 { animation-delay: 0s; fill: url(#grad-node-core); }
      .n2 { animation-delay: 0.8s; fill: url(#grad-node-core); }
      .n3 { animation-delay: 1.6s; fill: url(#grad-node-core); }
      .n4 { animation-delay: 2.4s; fill: url(#grad-node-core); }

      /* Interatividade Hover por Lobo */
      .lobe-group { cursor: pointer; transition: all 0.3s ease; }
      .lobe-group path { transition: all 0.3s ease; }
      .lobe-group text { transition: all 0.3s ease; fill: #e9d5ff; font-size: 13px; }
      .lobe-title { font-weight: 700; font-size: 15px; fill: #f472b6; }

      .lobe-group:hover path {
        stroke: #f472b6 !important;
        stroke-width: 3.5px !important;
        filter: url(#glow-pink);
        transform: scale(1.02);
      }

      .lobe-group:hover text {
        fill: #ffffff !important;
        transform: translateX(5px);
      }

      .lobe-group:hover .lobe-title {
        filter: drop-shadow(0 0 10px #f472b6);
      }
    </style>
  </defs>

  <!-- Fundo Dark Violeta Complexo -->
  <rect width="100%" height="100%" fill="url(#grad-brain-depth)" rx="16" />

  <!-- Estrutura de Cérebro Detalhada com Sulcos -->
  <g id="brain-structure" filter="url(#glow-purple)" opacity="0.6">
    <path d="M 220,180 C 180,120 280,100 380,100 C 480,100 580,120 560,200 C 580,280 480,300 380,300 C 280,300 180,280 220,180 Z"
          fill="none" stroke="#8b5cf6" stroke-width="0.8"/>
    <!-- Adicionando mais caminhos complexos para os giros e sulcos -->
    <path d="M 280,130 C 310,140 330,160 380,120" fill="none" stroke="#8b5cf6" stroke-width="0.5" />
    <path d="M 380,120 C 420,140 460,130 480,140" fill="none" stroke="#8b5cf6" stroke-width="0.5" />
    <path d="M 480,140 C 510,160 530,180 560,200" fill="none" stroke="#8b5cf6" stroke-width="0.5" />
    <path d="M 220,260 C 260,240 280,220 300,340" fill="none" stroke="#a855f7" stroke-width="0.5" />
    <path d="M 300,340 C 340,320 360,300 420,360" fill="none" stroke="#a855f7" stroke-width="0.5" />
    <path d="M 420,360 C 460,340 480,320 540,300" fill="none" stroke="#ec4899" stroke-width="0.5" />
    <path d="M 220,180 C 240,160 260,140 280,130" fill="none" stroke="#ec4899" stroke-width="0.5" />
    <path d="M 280,130 C 320,150 350,160 380,220" fill="none" stroke="#8b5cf6" stroke-width="0.5" />
    <path d="M 380,220 C 420,200 450,180 480,140" fill="none" stroke="#a855f7" stroke-width="0.5" />
    <path d="M 540,300 C 510,280 490,260 480,140" fill="none" stroke="#ec4899" stroke-width="0.5" />
    <path d="M 220,260 C 240,280 260,300 300,340" fill="none" stroke="#8b5cf6" stroke-width="0.5" />
    <path d="M 380,220 C 340,240 320,260 280,130" fill="none" stroke="#a855f7" stroke-width="0.5" />
  </g>

  <!-- Conexões de Sinapses e Feixes de Fibra ótica (Fundo) -->
  <g>
    <path class="synapse-line" d="M 220,180 L 280,130 L 380,120 L 480,140 L 560,200 L 540,300 L 420,360 L 300,340 L 220,260 Z" filter="url(#glow-pink)"/>
    <path class="synapse-line" d="M 280,130 L 380,220 L 540,300" filter="url(#glow-pink)"/>
    <path class="synapse-line" d="M 220,260 L 380,220 L 480,140" filter="url(#glow-pink)"/>
    <path class="synapse-line" d="M 300,340 L 380,220 L 420,360" filter="url(#glow-pink)"/>
    <!-- Adicionando mais feixes cruzando o cérebro -->
    <path class="synapse-line" d="M 380,120 L 380,220 L 420,360" stroke-width="0.5" stroke="#ec4899" />
    <path class="synapse-line" d="M 480,140 L 380,220 L 300,340" stroke-width="0.5" stroke="#a855f7" />
  </g>

  <!-- LOBO FRONTAL (Lógica & Desenvolvimento) -->
  <g class="lobe-group">
    <path d="M 180,240 C 170,160 240,100 340,100 C 360,160 340,240 280,270 C 220,280 190,260 180,240 Z" 
          fill="none" stroke="#8b5cf6" stroke-width="2" filter="url(#glow-purple)" />
    
    <!-- Nós de Conexão com Brilho Pulsante -->
    <circle cx="240" cy="160" r="7" class="node n1" filter="url(#glow-pink)"/>
    <circle cx="300" cy="130" r="6" class="node n2" filter="url(#glow-pink)"/>
    <circle cx="210" cy="220" r="8" class="node n3" filter="url(#glow-pink)"/>

    <!-- Rótulo Detalhado -->
    <text x="140" y="80" class="lobe-title">LiiL</text>
    <text x="140" y="100">▸ ie</text>
    <text x="140" y="118">▸ i</text>
    <text x="140" y="136">▸ i</text>
    <line x1="220" y1="105" x2="260" y2="140" stroke="#a855f7" stroke-width="1.5" opacity="0.6" />
  </g>

  <!-- LOBO PARIETAL / TEMPORAL (Sistemas & Processamento) -->
  <g class="lobe-group">
    <path d="M 340,100 C 460,90 560,130 580,220 C 500,250 420,240 340,220 C 330,160 335,120 340,100 Z" 
          fill="none" stroke="#a855f7" stroke-width="2" filter="url(#glow-purple)" />
    
    <circle cx="420" cy="130" r="7" class="node n4" filter="url(#glow-pink)"/>
    <circle cx="500" cy="160" r="6" class="node n1" filter="url(#glow-pink)"/>
    <circle cx="380" cy="180" r="8" class="node n2" filter="url(#glow-pink)"/>

    <text x="440" y="60" class="lobe-title">i</text>
    <text x="440" y="80">▸ i</text>
    <text x="440" y="98">▸ ie</text>
    <line x1="430" y1="85" x2="420" y2="120" stroke="#ec4899" stroke-width="1.5" opacity="0.6" />
  </g>

  <!-- CÓRTEX OCCIPITAL & CEREBELO (Interface & Neurociência) -->
  <g class="lobe-group">
    <path d="M 580,220 C 620,280 580,360 500,370 C 460,330 480,260 580,220 Z" 
          fill="none" stroke="#ec4899" stroke-width="2" filter="url(#glow-purple)" />
    
    <circle cx="550" cy="270" r="8" class="node n3" filter="url(#glow-pink)"/>
    <circle cx="520" cy="330" r="6" class="node n4" filter="url(#glow-pink)"/>

    <text x="590" y="320" class="lobe-title">Ci</text>
    <text x="590" y="340">▸ i</text>
    <text x="590" y="358">▸ i</text>
    <line x1="580" y1="325" x2="550" y2="290" stroke="#f472b6" stroke-width="1.5" opacity="0.6" />
  </g>

  <!-- TRONCO ENCEFÁLICO (Base de Dados e Git) -->
  <g class="lobe-group">
    <path d="M 360,340 C 420,340 450,380 430,440 C 370,450 350,400 360,340 Z" 
          fill="none" stroke="#c084fc" stroke-width="2" />
    
    <circle cx="390" cy="380" r="7" class="node n2" filter="url(#glow-pink)"/>
    <circle cx="400" cy="420" r="6" class="node n1" filter="url(#glow-pink)"/>

    <text x="180" y="420" class="lobe-title">Ti</text>
    <text x="180" y="438">▸ i</text>
    <text x="180" y="456">▸ i</text>
    <line x1="330" y1="430" x2="380" y2="400" stroke="#c084fc" stroke-width="1.5" opacity="0.6" />
  </g>

  <!-- Título Superior com Letter-Spacing -->
  <text x="400" y="35" text-anchor="middle" fill="#f472b6" font-size="16" font-weight="bold" letter-spacing="4">
    NEURAL // NINA FERREIRA
  </text>
</svg>
